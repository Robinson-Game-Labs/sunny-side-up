<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunny Side Up</title>
<meta name="description" content="15 good news stories every morning: Mississippi Coast, national and global.">
<meta name="theme-color" content="#ff7a59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sunny Side Up">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: a sunrise band up top, a "start here" trio, then three color-coded shelves (Gulf teal / tangerine / berry) */
:root {
  --bg: #fff4ec;
  --paper: #ffffff;
  --ink: #2b1a14;
  --muted: #7a5c50;
  --line: #f1dccf;
  --sun-a: #ffb547;
  --sun-b: #ff7a59;
  --sun-c: #ff4f86;
  --local: #0b8a8a;
  --local-soft: #dff4f1;
  --national: #e8650f;
  --national-soft: #ffe9d6;
  --global: #c2307a;
  --global-soft: #fde3ef;
  --heart: #ff4f6d;
  --chip: #fbe9df;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1311; --paper: #2a1c18; --ink: #fbeee6; --muted: #c9a99b; --line: #3d2a24;
  --sun-a: #e89a2e; --sun-b: #e0603f; --sun-c: #d63c72;
  --local: #4fd1c5; --local-soft: #173533; --national: #ff9a52; --national-soft: #3a2416;
  --global: #ff7ab8; --global-soft: #3a1a2a; --heart: #ff6f87; --chip: #3a2620; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1d1311; --paper: #2a1c18; --ink: #fbeee6; --muted: #c9a99b; --line: #3d2a24;
  --sun-a: #e89a2e; --sun-b: #e0603f; --sun-c: #d63c72;
  --local: #4fd1c5; --local-soft: #173533; --national: #ff9a52; --national-soft: #3a2416;
  --global: #ff7ab8; --global-soft: #3a1a2a; --heart: #ff6f87; --chip: #3a2620; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun-b); outline-offset: 2px; border-radius: 6px; }

/* Sunrise header */
.sunrise { position: relative; overflow: hidden; background: linear-gradient(160deg, var(--sun-a), var(--sun-b) 55%, var(--sun-c)); color: #fff; }
.sunrise::after { content: ""; position: absolute; width: 520px; height: 520px; right: -140px; bottom: -330px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,.12) 45%, transparent 70%); pointer-events: none; }
.sunrise .wrap { position: relative; z-index: 1; padding-block: calc(28px + env(safe-area-inset-top, 0px)) 30px; display: grid; gap: 18px; }
.topline { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.date { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; opacity: .95; }
.streak { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.45);
  padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; }
.streak svg { width: 18px; height: 18px; }
.sunrise h1 { font-size: clamp(36px, 7vw, 64px); font-weight: 800; line-height: 1.02; letter-spacing: -.02em; }
.sunrise h1 span { display: block; font-size: .42em; font-weight: 600; letter-spacing: 0; opacity: .95; margin-top: 8px; }
.quote { margin: 0; max-width: 560px; background: rgba(255,255,255,.18); border-radius: 18px; padding: 14px 18px; }
.quote p { margin: 0; font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.3; }
.quote cite { display: block; margin-top: 4px; font-style: normal; font-size: 14px; opacity: .9; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; font-weight: 600; }
.counts a { text-decoration: none; background: #fff; color: var(--ink); padding: 6px 12px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; }
:root[data-theme="dark"] .counts a { color: #2b1a14; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .counts a { color: #2b1a14; } }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

main .wrap { padding-block: 28px 56px; display: grid; gap: 40px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.section-head h2 { font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
.section-head p { margin: 0; color: var(--muted); font-size: 14px; }

/* Start here */
.top3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.pick { position: relative; background: var(--paper); border-radius: 22px; padding: 22px 20px 18px; display: grid; gap: 10px; align-content: start;
  border: 2px solid var(--tone); box-shadow: 0 10px 0 -4px var(--tone-soft); }
.pick .rank { position: absolute; top: -14px; left: 18px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--tone); color: #fff; font-family: var(--display); font-weight: 800; font-size: 17px; }
.pick h3 { font-size: 21px; line-height: 1.2; margin-top: 6px; }
.pick p { margin: 0; color: var(--muted); font-size: 15px; }

/* Topic filter */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Shelves */
.shelf { border-radius: 26px; background: var(--tone-soft); padding: 20px; }
.shelf .section-head h2 { color: var(--tone); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 14px; }
.card { background: var(--paper); border-radius: 18px; padding: 18px; display: grid; gap: 10px; grid-template-rows: auto auto 1fr auto; min-width: 0; }
.card h3 { font-size: 19px; line-height: 1.25; }
.card p { margin: 0; font-size: 15px; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.chip.place { background: var(--tone-soft); color: var(--tone); }
.actions { display: flex; align-items: center; gap: 6px; border-top: 1px dashed var(--line); padding-top: 10px; }
.read { margin-right: auto; font-weight: 700; color: var(--tone); text-decoration: none; font-size: 15px; display: inline-flex; gap: 4px; align-items: center; }
.read:hover { text-decoration: underline; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; display: grid; place-items: center; cursor: pointer; transition: transform .15s; }
.icon-btn:hover { transform: scale(1.08); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[aria-pressed="true"] { background: var(--heart); border-color: var(--heart); color: #fff; }
.icon-btn[aria-pressed="true"] svg { fill: currentColor; }
.empty-filter { color: var(--muted); font-style: italic; margin: 4px 0 0; }

.t-local { --tone: var(--local); --tone-soft: var(--local-soft); }
.t-national { --tone: var(--national); --tone-soft: var(--national-soft); }
.t-global { --tone: var(--global); --tone-soft: var(--global-soft); }

/* Saved */
.saved { border: 2px dashed var(--line); border-radius: 22px; padding: 20px; }
.saved ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.saved li { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--paper); border-radius: 14px; padding: 10px 14px; }
.saved li a { font-weight: 600; text-decoration: none; min-width: 0; }
.saved li a:hover { text-decoration: underline; }
.saved .empty { color: var(--muted); margin: 0; }

footer { text-align: center; color: var(--muted); font-size: 13px; padding-block: 0 calc(32px + env(safe-area-inset-bottom, 0px)); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg);
  padding: 10px 18px; border-radius: 999px; font-weight: 600; opacity: 0; transition: .25s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.notice { background: var(--paper); border-radius: 18px; padding: 20px; color: var(--muted); }

@media (max-width: 760px) { .top3 { grid-template-columns: 1fr; gap: 22px; } .shelf { padding: 16px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<header class="sunrise">
  <div class="wrap">
    <div class="topline">
      <span class="date" id="date">Good morning</span>
      <span class="streak" id="streak" title="Days in a row you started with good news">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="streak-text">Day 1 of good news</span>
      </span>
    </div>
    <h1>Sunny Side Up<span>15 good things from the Gulf Coast, the country and the world</span></h1>
    <blockquote class="quote" id="quote"><p>&nbsp;</p></blockquote>
    <nav class="counts" aria-label="Jump to section">
      <a href="#local"><span class="dot" style="background:var(--local)"></span>Mississippi Coast</a>
      <a href="#national"><span class="dot" style="background:var(--national)"></span>Across the U.S.</a>
      <a href="#global"><span class="dot" style="background:var(--global)"></span>Around the world</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap" id="app">
    <p class="notice">Gathering today's good news…</p>
  </div>
</main>
<footer class="wrap">Summaries written fresh each morning. Tap any headline's link to read the original reporting.</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const SECTIONS = [
    { key: "local", label: "Mississippi Coast", note: "Within about 100 miles of Biloxi", tone: "t-local" },
    { key: "national", label: "Across the U.S.", note: "Good news from around the country", tone: "t-national" },
    { key: "global", label: "Around the world", note: "Hope from every corner of the map", tone: "t-global" }
  ];
  const TOPICS = ["All", "Kindness & community", "Science & health wins", "Animals & environment", "Progress & solutions"];
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const heartSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.3 5 6.8 5c2 0 3.4 1.1 4.2 2.4C11.8 6.1 13.2 5 15.2 5c3.5 0 5.6 3.6 4.3 6.8C19.5 16.4 12 21 12 21z"/></svg>';
  const shareSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v12M7 8l5-5 5 5"/></svg>';

  let data = null, topic = "All", favs = store.get("ssu-favs", []);
  const toastEl = document.getElementById("toast");
  let toastTimer;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800); }

  function updateStreak() {
    const today = new Date().toLocaleDateString("en-CA");
    const s = store.get("ssu-streak", { last: null, count: 0 });
    if (s.last !== today) {
      const y = new Date(); y.setDate(y.getDate() - 1);
      s.count = s.last === y.toLocaleDateString("en-CA") ? s.count + 1 : 1;
      s.last = today; store.set("ssu-streak", s);
    }
    document.getElementById("streak-text").textContent = s.count === 1 ? "Day 1 of good news" : s.count + "-day good news streak";
  }

  function allStories() { return SECTIONS.flatMap(s => data.sections[s.key].map(st => Object.assign({ section: s.key }, st))); }
  const isFav = id => favs.some(f => f.id === id && f.date === data.date);

  function actions(st) {
    const on = isFav(st.id);
    return '<div class="actions"><a class="read" href="' + esc(st.url) + '" target="_blank" rel="noopener">Read at ' + esc(st.source) + ' ↗</a>' +
      '<button class="icon-btn" data-fav="' + st.id + '" aria-pressed="' + on + '" aria-label="' + (on ? "Remove from saved" : "Save story") + '">' + heartSvg + '</button>' +
      '<button class="icon-btn" data-share="' + st.id + '" aria-label="Copy link to share">' + shareSvg + '</button></div>';
  }

  function render() {
    const stories = allStories();
    const byId = Object.fromEntries(stories.map(s => [s.id, s]));
    let html = "";

    html += '<section aria-labelledby="h-top"><div class="section-head"><h2 id="h-top">Short on time? Start here</h2><p>Today\'s three best reads</p></div><div class="top3">';
    data.top.forEach((id, i) => {
      const st = byId[id]; if (!st) return;
      html += '<article class="pick t-' + st.section + '"><span class="rank">' + (i + 1) + '</span><div class="meta"><span class="chip place">' + esc(st.place) + '</span></div><h3>' + esc(st.title) + '</h3><p>' + esc(st.summary) + '</p>' + actions(st) + '</article>';
    });
    html += '</div></section>';

    html += '<div class="filters" role="group" aria-label="Filter by topic">' + TOPICS.map(t => '<button data-topic="' + esc(t) + '" aria-pressed="' + (t === topic) + '">' + esc(t) + '</button>').join("") + '</div>';

    SECTIONS.forEach(sec => {
      const list = data.sections[sec.key].filter(st => topic === "All" || st.topic === topic);
      html += '<section class="shelf ' + sec.tone + '" id="' + sec.key + '" aria-labelledby="h-' + sec.key + '"><div class="section-head"><h2 id="h-' + sec.key + '">' + sec.label + '</h2><p>' + sec.note + '</p></div>';
      if (!list.length) html += '<p class="empty-filter">No ' + esc(topic.toLowerCase()) + ' stories here today.</p>';
      else html += '<div class="cards">' + list.map(st => '<article class="card ' + sec.tone + '"><div class="meta"><span class="chip place">' + esc(st.place) + '</span><span class="chip">' + esc(st.topic) + '</span></div><h3>' + esc(st.title) + '</h3><p>' + esc(st.summary) + '</p>' + actions(Object.assign({ section: sec.key }, st)) + '</article>').join("") + '</div>';
      html += '</section>';
    });

    html += '<section class="saved" aria-labelledby="h-saved"><div class="section-head"><h2 id="h-saved">Saved stories</h2><p>Tap the heart on any story to keep it here</p></div>';
    if (!favs.length) html += '<p class="empty">Nothing saved yet. Hearts you tap stay here even after tomorrow\'s refresh.</p>';
    else html += '<ul>' + favs.slice().reverse().map(f => '<li><a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.title) + '</a><button class="icon-btn" data-unsave="' + esc(f.date + "|" + f.id) + '" aria-pressed="true" aria-label="Remove from saved">' + heartSvg + '</button></li>').join("") + '</ul>';
    html += '</section>';

    document.getElementById("app").innerHTML = html;
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t || !data) return;
    if (t.dataset.topic) { topic = t.dataset.topic; render(); return; }
    if (t.dataset.fav) {
      const st = allStories().find(s => s.id === t.dataset.fav);
      if (isFav(st.id)) { favs = favs.filter(f => !(f.id === st.id && f.date === data.date)); toast("Removed from saved"); }
      else { favs.push({ id: st.id, date: data.date, title: st.title, url: st.url }); toast("Saved"); }
      store.set("ssu-favs", favs); render(); return;
    }
    if (t.dataset.unsave) {
      const [d, id] = t.dataset.unsave.split("|");
      favs = favs.filter(f => !(f.id === id && f.date === d)); store.set("ssu-favs", favs); render(); toast("Removed from saved"); return;
    }
    if (t.dataset.share) {
      const st = allStories().find(s => s.id === t.dataset.share);
      const text = st.title + " — " + st.url;
      try {
        navigator.clipboard.writeText(text).then(() => toast("Link copied. Paste it to a friend!"), () => toast("Couldn't copy. Long-press the Read link instead."));
      } catch (err) { toast("Couldn't copy. Long-press the Read link instead."); }
    }
  });

  updateStreak();
  fetch("stories.json", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(); return r.json(); }).then(d => {
    data = d;
    document.getElementById("date").textContent = "Good morning · " + d.dateLabel;
    document.getElementById("quote").innerHTML = "<p>“" + esc(d.quote.text) + "”</p><cite>— " + esc(d.quote.author) + "</cite>";
    render();
  }).catch(() => {
    document.getElementById("app").innerHTML = '<p class="notice">Today\'s stories didn\'t load. Pull to refresh or reopen the page in a moment.</p>';
  });
})();
</script>

</body>
</html>
